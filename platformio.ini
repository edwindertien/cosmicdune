; PlatformIO Project Configuration File
;
; cosmic dune -- sensor pod firmware, Raspberry Pi Pico W
; Iteration 1d: adds WiFi + OSC telemetry to the hub, with settings
; (SSID/password/hub address) persisted to LittleFS via NetConfigStore --
; see src/core/net_config.*. USB MIDI/TinyUSB is still out for now -- see
; the CLI-not-responding debugging earlier -- plain Serial remains the
; core's default USB CDC.
;
[platformio]
default_envs = pico_w

[env:pico_w]
; NOTE (unverified -- confirm on first `pio run`): maxgerhardt's
; platform-raspberrypi wrapper names the Pico W board "rpipicow". If this
; env fails to resolve, run `pio boards raspberrypi | grep -i pico` to find
; the exact id for your installed platform version and fix this line.
board                        = rpipicow
platform                     = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.core             = earlephilhower
framework                    = arduino
board_build.f_cpu            = 133000000L
; LittleFS partition for /netconfig.json (a few hundred bytes) -- 64k is
; generous headroom for a single small JSON file, not a sizing constraint
; hit in practice.
board_build.filesystem_size  = 64k
monitor_speed                = 115200
upload_protocol               = picotool

lib_deps =
    fastled/FastLED @ ^3.9
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/CNMAT/OSC.git

; NOTE on the OSC dependency: PlatformIO's registry entry "cnmat/OSC" is
; known-stale (see github.com/CNMAT/OSC/issues/139) -- pulling directly
; from the GitHub repo, as above, is the confirmed-working way to get it
; rather than the registry shorthand.
;
; WiFi (WiFi.h/WiFiUdp.h) and LittleFS are both bundled with this core for
; board "rpipicow" -- no separate lib_deps entry needed for either, same
; as the arm-controller project's WiFi AP + ConfigStore.
;
; NOTE (unverified on this exact combination -- still the prime suspect if
; the CLI comes up now but hangs once the LED strip init runs): FastLED's
; native RP2040 support (PIO-driven WS2812 timing) needs FastLED 3.6+. If
; `pio run` can't resolve a PIO-capable FastLED build for board "rpipicow",
; the fallback is Adafruit_NeoPixel.
