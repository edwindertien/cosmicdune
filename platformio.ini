; PlatformIO Project Configuration File
;
; cosmic dune -- sensor pod firmware, Raspberry Pi Pico W
; Iteration 1e: adds an SH1107 OLED (I2C0) + M5Stack encoder (I2C1) for an
; on-pod display/menu, alongside the existing CLI. See src/io/menu.h for
; what's covered on-pod vs. CLI-only. USB MIDI/TinyUSB is still out for
; now -- see the CLI-not-responding debugging earlier -- plain Serial
; remains the core's default USB CDC.
;
[platformio]
default_envs = pico_w

[env:pico_w]
; NOTE (unverified -- confirm on first `pio run`): maxgerhardt's
; platform-raspberrypi wrapper names the Pico W board "rpipicow". If this
; env fails to resolve, run `pio boards raspberrypi | grep -i pico` to find
; the exact id for your installed platform version and fix this line.
board                        = rpipicow
platform                     = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.core             = earlephilhower
framework                    = arduino
board_build.f_cpu            = 133000000L
; LittleFS partition for /netconfig.json + /podconfig.json (each a few
; hundred bytes) -- 64k is generous headroom, not a sizing constraint hit
; in practice.
board_build.filesystem_size  = 64k
monitor_speed                = 115200
lib_ldf_mode                 = chain
upload_protocol               = picotool

; This board (Pico W) has WiFi built in via the CYW43 chip and never uses
; the "ESPHost" backend (a different hardware setup: a plain RP2040 wired
; to an external ESP32 co-processor). But arduino-pico bundles ALL its
; WiFi backends -- CYW43, ESPHost, WINC1500 -- under one "WiFi" library
; folder, and lib_ldf_mode=chain's real dependency discovery compiles
; every file in a library it pulls in, not just the backend a given board
; actually needs. lwIP_ESPHost.cpp needs a pin macro (ESPHOST_DATA_READY)
; that's only defined for boards actually wired that way -- never for
; rpipicow -- so it hard-fails to compile. This is a confirmed, currently
; open, unresolved upstream issue (maxgerhardt/platform-raspberrypi#83),
; not something specific to this project. Explicitly excluding it is safe:
; we never use ESPHost networking, only CYW43 (via plain WiFi.h/WiFiUdp.h).
; If a similar error ever surfaces for a different irrelevant WiFi backend
; file (e.g. something WINC1500-specific), the same fix applies -- add
; its library name here too.
lib_ignore                   = lwIP_ESPHost

lib_deps =
    fastled/FastLED @ ^3.9
    bblanchon/ArduinoJson @ ^7.0.0
    https://github.com/CNMAT/OSC.git
    adafruit/Adafruit SH110X @ ^2.1.10
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.16.1

; NOTE on the OSC dependency: PlatformIO's registry entry "cnmat/OSC" is
; known-stale (see github.com/CNMAT/OSC/issues/139) -- pulling directly
; from the GitHub repo, as above, is the confirmed-working way to get it
; rather than the registry shorthand.
;
; NOTE on Adafruit SH110X: it depends on Adafruit GFX Library and Adafruit
; BusIO -- both listed explicitly above, which lib_ldf_mode=off REQUIRES
; (see below). Version pinned to ^2.1.10 to match a previous project
; (picoST3215DXL) already confirmed working against this exact OLED unit,
; rather than drifting to whatever's newest.
;
; The M5Stack Unit Encoder needs NO library entry at all -- drivers/
; m5_encoder.cpp talks to it over raw I2C directly (register map ported
; from that same previous project), rather than depending on the official
; m5stack/M5Unit-Encoder library and its less-certain begin() overload.
;
; lib_ldf_mode=chain (corrected from an earlier "off"): "off" turned out
; to also block discovery of framework-BUNDLED headers like Wire.h and
; LittleFS.h, not just third-party libraries -- it appeared to work for a
; while only because of leftover build cache from before "off" was set;
; adding/removing libraries this iteration reshuffled the dependency graph
; enough to expose it as a real fatal error. "chain" follows actual
; #include chains (so bundled headers resolve correctly again) without
; "chain+"/"deep+"'s extra exhaustive-scan pass for libraries with unclear
; metadata -- that extra pass, not real dependency discovery itself, was
; what made earlier scans slow (FastLED's huge per-platform file tree, and
; the git-fetched OSC library's missing registry manifest).
;
; WiFi (WiFi.h/WiFiUdp.h), LittleFS, and Wire/Wire1 (I2C) are all bundled
; with this core for board "rpipicow" -- no separate lib_deps entry needed
; for any of them, same as the arm-controller project's WiFi AP + ConfigStore.
;
; NOTE (unverified on this exact combination -- still the prime suspect if
; the CLI comes up now but hangs once the LED strip init runs): FastLED's
; native RP2040 support (PIO-driven WS2812 timing) needs FastLED 3.6+. If
; `pio run` can't resolve a PIO-capable FastLED build for board "rpipicow",
; the fallback is Adafruit_NeoPixel.